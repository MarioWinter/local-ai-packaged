# 2026-05-30 — Single-engine: Brave via ScraperOps wrapper.
#
# Only `brave-scrapeops` (custom engine that wraps Brave queries
# through https://proxy.scrapeops.io/v1/?api_key=K&url=ENC&render_js=true)
# is enabled. Brave migrated to a JS-rendered Svelte SPA; render_js=true
# lets ScraperOps headless-render the page so the brave HTML parser can
# extract results. Anti-bot + residential IP rotation handled by SO.
#
# One chat query = one outbound request to proxy.scrapeops.io = one
# ScraperOps credit.
#
# Engine module: vane/searxng-engines/brave_scrapeops.py
# Env var: SCRAPEOPS_API_KEY (forwarded into the searxng subshell by
# the custom vane/entrypoint.sh).
engines:
  - name: brave-scrapeops
    engine: brave_scrapeops
    shortcut: bsops
    categories: [general, web]
    timeout: 60.0
    disabled: false

  # Disable every other default engine so only brave-scrapeops fires.
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: google
    disabled: true
  - name: bing
    disabled: true
  - name: qwant
    disabled: true
  - name: qwant news
    disabled: true
  - name: qwant images
    disabled: true
  - name: qwant videos
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true
  - name: mojeek
    disabled: true
  - name: yahoo
    disabled: true
  - name: aol
    disabled: true
  - name: wolframalpha
    disabled: true
